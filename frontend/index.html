        fetchSystemStatus();

      const callBackendApi = async (endpoint, payload, actionTitle) => {
        if (isRunning) return;
        setIsRunning(true);
        setProgressPct(25);
        setProgressLabel(actionTitle);
        appendLog(`🚀 [START] ${actionTitle}...`);
        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            appendLog(`❌ [ERROR] ${data.error || res.statusText}`);
            setProgressPct(0);
          } else {
            setProgressPct(100);
            appendLog(`✅ [SUCCESS] ${JSON.stringify(data)}`);
            fetchSystemStatus();
          }
          return data;

          setProgressPct(100);
          return null;

                            + Tambah LoRA
                          </button>
                        </div>
                        {loraItems.map((item, i) => (
                          <div key={i} className="flex items-center gap-2 p-2 rounded-xl bg-slate-950 border border-slate-800">
                            <input
                              type="text"
                              value={item.path}
                              onChange={(e) => {
                                const next = [...loraItems];
                                next[i].path = e.target.value;
                                setLoraItems(next);
                              }}
                              className="flex-1 rounded-lg bg-slate-900 border border-slate-800 px-3 py-1.5 text-xs font-mono text-slate-200"
                            />
                            <input
                              type="number"
                              step="0.1"
                              value={item.strength}
                              onChange={(e) => {
                                const next = [...loraItems];
                                next[i].strength = parseFloat(e.target.value) || 0;
                                setLoraItems(next);
                              }}
                              className="w-20 rounded-lg bg-slate-900 border border-slate-800 px-2 py-1.5 text-xs font-mono text-indigo-300"
                            />
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Base Model Path</label>
                          <input
                            type="text"
                            value={loraBasePath}
                            onChange={(e) => setLoraBasePath(e.target.value)}
                            className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Fine-Tuned Model Path</label>
                          <input
                            type="text"
                            value={loraTunedPath}
                            onChange={(e) => setLoraTunedPath(e.target.value)}
                            className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                          />
                        </div>
                      </div>
                    )}

                    <div className="flex gap-3">
                      <input
                        type="text"
                        value={loraOutPath}
                        onChange={(e) => setLoraOutPath(e.target.value)}
                        className="flex-1 rounded-xl bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                      />
                      <button
                        type="button"
                        onClick={() =>
                          callBackendApi(
                            "/api/lora-studio",
                            {
                              mode: loraSubTab,
                              arch_id: loraArch,
                              loras_cfg: loraItems,
                              base_model_path: loraBasePath,
                              tuned_model_path: loraTunedPath,
                              output_path: loraOutPath,
                              target_rank: targetRank,
                              target_alpha: targetRank,
                              qkv_output_mode: qkvMode,
                              krea2_mix_precision_bf16: kreaMixPrecision
                            },
                            `LoRA Studio: ${loraSubTab.toUpperCase()}`
                          )
                        }
                        className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs transition"
                      >
                        🧬 {t("Jalankan LoRA Studio", "Run LoRA Studio")}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 4: QUANTIZER & GGUF */}
              {activeTab === "quant" && (
                <div className="space-y-6">
                  <div className="flex flex-wrap gap-2 p-1.5 rounded-xl bg-slate-900 border border-slate-800">
                    {[
                      { id: "int8_convrot", label: "4A. 🎯 Universal INT8 ConvRot Quantizer (MOSS 757T & Krea 2 12.56GB)" },
                      { id: "unquantize", label: "4B. 🔓 Universal Unquantizer v5.0 (INT8/FP8 -> BF16)" },
                      { id: "gguf", label: "4C. ⚡ Krea 2 to GGUF T4 GPU Converter v3.0" }
                    ].map((qt) => (
                      <button
                        key={qt.id}
                        type="button"
                        onClick={() => setQuantSubTab(qt.id)}
                        className={`flex-1 py-2 px-3 rounded-lg text-xs font-semibold transition ${
                          quantSubTab === qt.id ? "bg-indigo-600 text-white" : "text-slate-400 hover:text-slate-200"
                        }`}
                      >
                        {qt.label}
                      </button>
                    ))}
                  </div>

                  <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Input Model Path (.safetensors)</label>
                        <input
                          type="text"
                          value={quantInputPath}
                          onChange={(e) => setQuantInputPath(e.target.value)}
                          className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                        />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Output File Path</label>
                        <input
                          type="text"
                          value={quantOutputPath}
                          onChange={(e) => setQuantOutputPath(e.target.value)}
                          className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                        />
                      </div>
                    </div>

                    {quantSubTab === "gguf" ? (
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1">Profil Kuantisasi GGUF Krea 2:</label>
                        <select
                          value={ggufProfile}
                          onChange={(e) => setGgufProfile(e.target.value)}
                          className="w-full rounded-xl bg-slate-950 border border-slate-800 px-3 py-2.5 text-xs text-slate-200"
                        >
                          <option value="True_Q4_K_M_HighQuality_8.28GiB">
                            💎 True_Q4_K_M_HighQuality_8.28GiB (Upgrade Q3_K &amp; IQ4_XS ke Q4_K + Pertahankan Q5_K &amp; Q6_K)
                          </option>
                          <option value="Byteshape_Exact_7.35GiB">
                            📦 Byteshape_Exact_7.35GiB (100% Identik JSON ByteShape: Q3_K + IQ4_XS + Q5_K + Q6_K)
                          </option>
                        </select>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Prefix Alignment Mode</label>
                          <select
                            value={prefixMode}
                            onChange={(e) => setPrefixMode(e.target.value)}
                            className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-200"
                          >
                            <option value="Auto">Auto (Bare keys MOSS, Original Krea 2)</option>
                            <option value="Strip_Prefix">Strip_Prefix</option>
                            <option value="Add_Prefix">Add_Prefix</option>
                            <option value="Keep_Original">Keep_Original</option>
                          </select>
                        </div>
                        <label className="flex items-center gap-2 text-xs text-slate-300 pt-5 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={restoreRopeBands}
                            onChange={(e) => setRestoreRopeBands(e.target.checked)}
                            className="rounded accent-indigo-500"
                          />
                          Restore MOSS `rope.bands` ([16] F32)
                        </label>
                        {quantSubTab === "int8_convrot" && (
                          <label className="flex items-center gap-2 text-xs text-slate-300 pt-5 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={injectMossAttnConfig}
                              onChange={(e) => setInjectMossAttnConfig(e.target.checked)}
                              className="rounded accent-indigo-500"
                            />
                            Inject 42 `comfy_attention.config` ([35] U8)
                          </label>
                        )}
                      </div>
                    )}

                    <button
                      type="button"
                      onClick={() =>
                        callBackendApi(
                          "/api/quantize",
                          {
                            mode: quantSubTab,
                            input_path: quantInputPath,
                            output_path: quantOutputPath,
                            prefix_mode: prefixMode,
                            restore_moss_rope_bands: restoreRopeBands,
                            inject_moss_attention_config: injectMossAttnConfig,
                            gguf_profile: ggufProfile
                          },
                          `Running ${quantSubTab.toUpperCase()}`
                        )
                      }
                      className="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs transition"
                    >
                      ⚡ {t("Mulai Proses Konversi / Kuantisasi", "Start Quantization / Conversion")}
                    </button>
                  </div>
                </div>
              )}

              {/* TAB 5: X-RAY & ANALYZER */}
              {activeTab === "xray" && (
                <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
                  <h2 className="text-base font-bold text-white">
                    5. 🔬 The X-Ray Metadata &amp; Tensor Blueprint Exporter
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Input .safetensors Path</label>
                      <input
                        type="text"
                        value={xrayInputPath}
                        onChange={(e) => setXrayInputPath(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Output Report Path</label>
                      <input
                        type="text"
                        value={xrayOutputPath}
                        onChange={(e) => setXrayOutputPath(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Format</label>
                      <select
                        value={xrayFormat}
                        onChange={(e) => setXrayFormat(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-200"
                      >
                        <option value="json">JSON (.json)</option>
                        <option value="txt">Formatted Table (.txt)</option>
                      </select>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      callBackendApi(
                        "/api/xray",
                        { input_path: xrayInputPath, output_path: xrayOutputPath, format: xrayFormat },
                        `Exporting X-Ray Report (${xrayFormat.toUpperCase()})`
                      )
                    }
                    className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs"
                  >
                    🕵️ Export X-Ray Report
                  </button>
                </div>
              )}

              {/* TAB 6: HUGGINGFACE HUB PUBLISHER */}
              {activeTab === "hf" && (
                <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
                  <h2 className="text-base font-bold text-white">
                    6. 🤗 HuggingFace Hub Login &amp; Multi-File Publisher
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">HuggingFace WRITE Token</label>
                      <input
                        type="password"
                        value={hfTokenInput}
                        onChange={(e) => setHfTokenInput(e.target.value)}
                        placeholder="hf_..."
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Target Model Repo Name</label>
                      <input
                        type="text"
                        value={hfRepoName}
                        onChange={(e) => setHfRepoName(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-200"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-xs text-slate-400 mb-1">File / Folder Paths (Comma-separated)</label>
                      <input
                        type="text"
                        value={hfUploadPaths}
                        onChange={(e) => setHfUploadPaths(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs font-mono text-slate-200"
                      />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-xs text-slate-400 mb-1">Commit Message</label>
                      <input
                        type="text"
                        value={hfCommitMsg}
                        onChange={(e) => setHfCommitMsg(e.target.value)}
                        className="w-full rounded-lg bg-slate-950 border border-slate-800 px-3 py-2 text-xs text-slate-200"
                      />
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      callBackendApi(
                        "/api/hf-upload",
                        {
                          hf_token: hfTokenInput,
                          model_repo_name: hfRepoName,
                          paths_csv: hfUploadPaths,
                          commit_message: hfCommitMsg
                        },
                        `Uploading to HuggingFace Hub (${hfRepoName})`
                      )
                    }
                    className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition"
                  >
                    🚀 Login &amp; Upload ke HuggingFace Hub
                  </button>
                </div>
              )}
            </div>

            {/* RIGHT SIDEBAR: INVARIANT GUARD, DETECTED LOCAL FILES & LIVE CONSOLE (4 COLS) */}
            <div className="lg:col-span-4 space-y-6">
              <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    🛡️ {t("Pelindung Struktur Layer", "Layer Invariant Guard")}
                  </h3>
                  <span className="text-[11px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/30">
                    100% LOCKED
                  </span>
                </div>
                <div className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-[11px] text-slate-300 leading-snug">
                  {currentArchSpec.int8Spec}
                </div>
                <div className="flex flex-wrap gap-1">
                  {currentArchSpec.protectedKeywords.map((kw) => (
                    <span
                      key={kw}
                      className="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-300 border border-indigo-500/30"
                    >
                      {kw}
                    </span>
                  ))}
                </div>
              </div>

              {/* Local Models Detected in /content */}
              <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    📂 {t("File Model di /content", "Models in /content")}
                  </h3>
                  <button
                    type="button"
                    onClick={fetchSystemStatus}
                    className="text-xs text-indigo-400 hover:underline"
                  >
                    🔄 Refresh
                  </button>
                </div>
                <div className="max-h-36 overflow-y-auto space-y-1.5 text-xs font-mono">
                  {sysInfo.local_models && sysInfo.local_models.length > 0 ? (
                    sysInfo.local_models.map((m, idx) => (
                      <div
                        key={idx}
                        onClick={() => setBaseModelPath(m.path)}
                        className="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 cursor-pointer flex justify-between items-center"
                        title="Klik untuk jadikan Base Model"
                      >
                        <span className="truncate text-slate-200">{m.name}</span>
                        <span className="text-emerald-400 shrink-0 ml-2">{m.size_gb} GB</span>
                      </div>
                    ))
                  ) : (
                    <div className="text-slate-500 text-[11px]">
                      {t("Belum ada file .safetensors di /content (Gunakan Tab 1 untuk mengunduh).", "No .safetensors in /content yet (Use Tab 1 to download).")}
                    </div>
                  )}
                </div>
              </div>

              {/* Real-Time Terminal */}
              <div className="p-5 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    💻 {t("Terminal & Progress Real-Time", "Live Terminal & Progress")}
                  </h3>
                  <span className="text-xs font-mono text-indigo-400">{progressPct}%</span>
                </div>
                <div className="w-full h-2.5 rounded-full bg-slate-950 border border-slate-800 overflow-hidden">
                  <div
                    style={{ width: `${progressPct}%` }}
                    className="h-full bg-gradient-to-r from-indigo-500 via-violet-500 to-emerald-500 transition-all duration-300"
                  />
                </div>
                {progressLabel && (
                  <div className="text-[11px] text-indigo-300 font-mono truncate">{progressLabel}</div>
                )}
                <div className="h-56 rounded-xl bg-slate-950 border border-slate-800 p-3 font-mono text-[11px] text-slate-300 overflow-y-auto space-y-1.5">
                  {statusLogs.map((log, index) => (
                    <div key={index} className="leading-relaxed break-words">
                      {log}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MergingStudioApp />);
  </script>
</body>
</html>
